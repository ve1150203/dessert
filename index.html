<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試吃點心團</title>
    <style>
        :root {
            --primary-cheese: #FFE082;
            --primary-dark: #FFB300;
            --accent-brown: #6D4C41;
            --bg-cream: #FFFDE7;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #FFF9C4, #FFE0B2);
            color: var(--accent-brown);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: #FFFFFF;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(255, 179, 0, 0.25);
            border: 4px dashed #FFB300;
            max-width: 450px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .emoji-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-15px);}
            60% {transform: translateY(-7px);}
        }

        h1 {
            color: #5D4037;
            font-size: 2rem;
            margin: 10px 0;
        }

        .divider {
            width: 60px;
            height: 4px;
            background-color: #FFD54F;
            margin: 20px auto;
            border-radius: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #795548;
            line-height: 1.6;
            margin: 15px 0;
            font-weight: bold;
        }

        .coming-soon {
            display: inline-block;
            background-color: #FFF8E1;
            color: #E65100;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            border: 2px solid #FFE082;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            letter-spacing: 2px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #A1887F;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji-icon">🧀🏃💨</div>
        <h1>試吃點心團</h1>
        <div class="divider"></div>
        <p>這次不小心錯過啦～<br>不過美味的腳步不會停歇！</p>
        <div>
            <span class="coming-soon">擇日開張 · 敬請期待 ~~~~ ✨</span>
        </div>
        <div class="footer-note">
            找不到夏天 💛
        </div>
    </div>

</body>
</html>
