<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欣雄開冰箱</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #fcfbf7; }
  </style>
</head>
<body class="text-slate-800 pb-16">

  <!-- Header Header -->
  <header class="bg-amber-900 text-amber-50 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <h1 class="text-2xl md:text-3xl font-bold tracking-wide">美味甜點伴手禮 聯合團購</h1>
      <p class="text-amber-200 text-sm mt-1">喬伊絲手工甜品 × 香港淳珍伴手禮</p>
      
      <!-- Countdown Banner -->
      <div class="mt-4 bg-amber-950/60 inline-flex flex-col sm:flex-row items-center justify-center gap-2 px-5 py-2.5 rounded-full border border-amber-700/50 text-sm">
        <span class="flex items-center text-amber-300 font-medium">
          <i class="fa-regular font-bold fa-clock mr-1.5"></i> 截止時間：11月19日 下午 3:00
        </span>
        <span id="countdownText" class="font-bold text-amber-100 bg-amber-800/80 px-3 py-0.5 rounded-full text-xs">
          計算中...
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

    <!-- Form Section -->
    <form id="orderForm" onsubmit="handleFormSubmit(event)" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 md:p-7">
      
      <!-- Buyer Name Input -->
      <div class="mb-8 bg-amber-50/50 p-4 rounded-xl border border-amber-100">
        <label for="userName" class="block text-base font-bold text-amber-950 mb-2">
          訂購人姓名 <span class="text-rose-500">*</span>
        </label>
        <input 
          type="text" 
          id="userName" 
          required 
          placeholder="請輸入您的姓名（例如：王小明）" 
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition text-slate-800 bg-white"
        >
      </div>

      <!-- Category 1: Joyce Dessert -->
      <div class="mb-8">
        <div class="flex items-center border-b-2 border-amber-800/20 pb-3 mb-4">
          <span class="bg-amber-800 text-white font-bold text-xs px-2.5 py-1 rounded mr-2">類別 A</span>
          <h2 class="text-xl font-bold text-amber-900">喬伊絲手工甜品</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="joyceProducts"></div>
      </div>

      <!-- Category 2: Hong Kong Chun Zhen -->
      <div class="mb-8">
        <div class="flex items-center border-b-2 border-amber-800/20 pb-3 mb-4">
          <span class="bg-amber-700 text-white font-bold text-xs px-2.5 py-1 rounded mr-2">類別 B</span>
          <h2 class="text-xl font-bold text-amber-900">香港淳珍伴手禮</h2>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="hkProducts"></div>
      </div>

      <!-- Footer Action & Live Total -->
      <div class="sticky bottom-4 bg-slate-900 text-white p-4 rounded-xl shadow-xl flex items-center justify-between z-10 border border-slate-700">
        <div>
          <div class="text-xs text-slate-400">本次訂購小計</div>
          <div class="text-2xl font-bold text-amber-400">NT$ <span id="currentTotal">0</span></div>
        </div>
        <button 
          id="submitBtn"
          type="submit" 
          class="bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold px-6 py-3 rounded-lg transition flex items-center shadow"
        >
          <i class="fa-solid fa-paper-plane mr-2"></i> 送出團購單
        </button>
      </div>
    </form>

    <!-- Public Summary Section -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 md:p-7 space-y-6">
      
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
        <div>
          <h2 class="text-xl font-bold text-slate-900">團購公開明細與統計</h2>
          <p class="text-xs text-slate-500 mt-0.5">即時雲端同步明細，方便對帳與店家下單彙整</p>
        </div>
        
        <div class="flex items-center gap-2">
          <button type="button" onclick="loadOrders()" class="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-3 py-2 rounded-lg font-medium transition flex items-center" title="重新載入最新資料">
            <i class="fa-solid fa-rotate mr-1.5"></i> 重新整理
          </button>
          <button type="button" onclick="copySummaryText()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium transition flex items-center">
            <i class="fa-regular fa-copy mr-1.5"></i> 複製統計
          </button>
          <button type="button" onclick="exportCSV()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-medium transition flex items-center">
            <i class="fa-solid fa-file-csv mr-1.5"></i> 匯出 CSV
          </button>
        </div>
      </div>

      <!-- Item Aggregation Table -->
      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center">
          <i class="fa-solid fa-boxes-packing text-amber-700 mr-2"></i> 各品項預購總數量統計
        </h3>
        <div class="overflow-x-auto rounded-lg border border-slate-200">
          <table class="w-full text-sm text-left text-slate-700">
            <thead class="bg-slate-50 text-slate-700 text-xs uppercase border-b border-slate-200">
              <tr>
                <th class="px-4 py-2.5">商品品名</th>
                <th class="px-4 py-2.5 text-right">單價</th>
                <th class="px-4 py-2.5 text-center">總數量</th>
                <th class="px-4 py-2.5 text-right">總金額</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody" class="divide-y divide-slate-100"></tbody>
            <tfoot class="bg-amber-50/60 font-bold text-amber-950 border-t border-amber-200">
              <tr>
                <td class="px-4 py-3" colspan="2">全團總計</td>
                <td class="px-4 py-3 text-center" id="grandTotalQty">0 盒</td>
                <td class="px-4 py-3 text-right text-base text-amber-800">NT$ <span id="grandTotalAmount">0</span></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- Individual Order List -->
      <div class="pt-2">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold text-slate-700 flex items-center">
            <i class="fa-solid fa-list-check text-amber-700 mr-2"></i> 團員訂購明細 (<span id="orderCount">0</span> 筆)
          </h3>
          <span class="text-xs text-slate-400">點擊付款狀態切換 (需密碼)</span>
        </div>

        <div class="space-y-3" id="ordersList"></div>
      </div>
    </section>

  </main>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby-quN5c2iwOv1_zzxjXddfChrBZKUrnwZQiFIA_FoiqZlxAn1ejJ2ZNc5FvMqZbetrZw/exec";
    const ADMIN_PASS = '117117';

    const products = [
      { id: 'j1', category: '喬伊絲手工甜品', name: '楓糖布蕾', spec: '19.5*7*4.5CM · 250g±10%', price: 240, origPrice: 560, tag: '蛋奶素' },
      { id: 'j2', category: '喬伊絲手工甜品', name: '絲博巧磚', spec: '19.5*7*4.5CM · 260g±10%', price: 270, origPrice: 570, tag: '蛋奶素' },
      { id: 'j3', category: '喬伊絲手工甜品', name: '伯爵提拉', spec: '19.5*7*4.5CM · 250g±10%', price: 230, origPrice: 560, tag: '葷' },
      { id: 'j4', category: '喬伊絲手工甜品', name: '摩卡焦糖', spec: '19.5*7*4.5CM · 270g±10%', price: 250, origPrice: 560, tag: '蛋奶素' },
      { id: 'j5', category: '喬伊絲手工甜品', name: '特濃牛奶蛋糕', spec: '19.5*7*4.5CM · 300g±10%', price: 300, origPrice: 680, tag: '葷' },
      { id: 'j6', category: '喬伊絲手工甜品', name: '抹茶牛奶蛋糕', spec: '19.5*7*4.5CM · 300g±10%', price: 300, origPrice: 680, tag: '葷' },
      { id: 'j7', category: '喬伊絲手工甜品', name: '芋香牛奶蛋糕', spec: '19.5*7*4.5CM · 320g±10%', price: 300, origPrice: 680, tag: '葷' },
      { id: 'j8', category: '喬伊絲手工甜品', name: '楓檸輕語', spec: '19.5*7*4.5CM · 300g±10%', price: 310, origPrice: 720, tag: '葷' },
      { id: 'j9', category: '喬伊絲手工甜品', name: '伯爵果語', spec: '19.5*7*4.5CM · 290g±10%', price: 270, origPrice: 570, tag: '蛋奶素' },
      { id: 'hk1', category: '香港淳珍伴手禮', name: '開心果可可薄脆', spec: '135g/盒 (極緻酥脆)', price: 360, origPrice: 599, tag: '超人氣預購' },
      { id: 'hk2', category: '香港淳珍伴手禮', name: '榛果奶茶脆脆', spec: '135g/盒 (極緻酥脆)', price: 360, origPrice: 599, tag: '超人氣預購' },
    ];

    let orders = [];

    function initProducts() {
      const joyceContainer = document.getElementById('joyceProducts');
      const hkContainer = document.getElementById('hkProducts');
      joyceContainer.innerHTML = '';
      hkContainer.innerHTML = '';

      products.forEach(p => {
        const cardHtml = `
          <div class="border border-slate-200 rounded-xl p-4 bg-white flex flex-col justify-between hover:border-amber-300 transition shadow-sm">
            <div>
              <div class="flex items-start justify-between gap-2 mb-1">
                <h3 class="font-bold text-slate-800 text-base">${p.name}</h3>
                <span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium shrink-0">${p.tag}</span>
              </div>
              <p class="text-xs text-slate-400 mb-3">${p.spec}</p>
            </div>
            
            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <div>
                <span class="text-xs text-slate-400 line-through mr-1">NT$${p.origPrice}</span>
                <span class="text-lg font-bold text-amber-800">NT$${p.price}</span>
              </div>

              <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                <button type="button" onclick="updateQty('${p.id}', -1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-200 active:bg-slate-300 font-bold">-</button>
                <input type="number" id="qty_${p.id}" value="0" min="0" onchange="calcTotal()" class="w-10 h-8 text-center text-sm font-bold bg-transparent text-slate-800 focus:outline-none" />
                <button type="button" onclick="updateQty('${p.id}', 1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-200 active:bg-slate-300 font-bold">+</button>
              </div>
            </div>
          </div>
        `;

        if (p.category === '喬伊絲手工甜品') joyceContainer.innerHTML += cardHtml;
        else hkContainer.innerHTML += cardHtml;
      });
    }

    function updateQty(id, delta) {
      const input = document.getElementById(`qty_${id}`);
      let current = parseInt(input.value) || 0;
      input.value = Math.max(0, current + delta);
      calcTotal();
    }

    function calcTotal() {
      let total = 0;
      products.forEach(p => {
        const qty = parseInt(document.getElementById(`qty_${p.id}`)?.value) || 0;
        total += qty * p.price;
      });
      document.getElementById('currentTotal').innerText = total.toLocaleString();
    }

    async function loadOrders() {
      try {
        const res = await fetch(GAS_API_URL);
        orders = await res.json();
        renderSummaryTable();
        renderOrdersList();
      } catch (e) {
        console.error("載入失敗:", e);
      }
    }

    async function postToGAS(payload) {
      // 相容跨域 CORS 傳輸設定
      return fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify(payload)
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const userName = document.getElementById('userName').value.trim();

      if (!userName) {
        alert('請填寫訂購人姓名！');
        return;
      }

      const selectedItems = [];
      let totalAmount = 0;

      products.forEach(p => {
        const qty = parseInt(document.getElementById(`qty_${p.id}`).value) || 0;
        if (qty > 0) {
          selectedItems.push(`${p.name} × ${qty}`);
          totalAmount += qty * p.price;
        }
      });

      if (selectedItems.length === 0) {
        alert('請至少選擇一項商品與數量！');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '送出中...';

      const payload = {
        action: 'add',
        orderId: 'ORD-' + Date.now().toString().slice(-6),
        userName: userName,
        detailsStr: selectedItems.join('、'),
        totalAmount: totalAmount,
        time: new Date().toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })
      };

      try {
        await postToGAS(payload);
        alert(`下單成功！感謝 ${userName}，金額計 NT$ ${totalAmount.toLocaleString()} 元。`);
        document.getElementById('userName').value = '';
        products.forEach(p => document.getElementById(`qty_${p.id}`).value = 0);
        calcTotal();
        setTimeout(loadOrders, 1000); // 稍微緩衝 1 秒後載入最新明細
      } catch (err) {
        alert('送出失敗，請稍後重試');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> 送出團購單';
      }
    }

    async function togglePaid(orderId) {
      const inputPass = prompt('請輸入主購密碼以切換付款狀態：');
      if (inputPass === null) return;
      if (inputPass !== ADMIN_PASS) {
        alert('密碼錯誤！無法修改付款狀態。');
        return;
      }

      await postToGAS({ action: 'togglePaid', orderId: orderId });
      setTimeout(loadOrders, 1000);
    }

    async function deleteOrder(orderId, userName) {
      const inputPass = prompt(`【主購權限驗證】\n要刪除「${userName}」這筆訂單，請輸入主購密碼：`);
      if (inputPass === null) return;
      if (inputPass !== ADMIN_PASS) {
        alert('密碼錯誤！無法進行刪除操作。');
        return;
      }

      if (confirm(`確定要刪除「${userName}」這筆訂單嗎？`)) {
        await postToGAS({ action: 'delete', orderId: orderId });
        setTimeout(loadOrders, 1000);
      }
    }

    function renderSummaryTable() {
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = '';
      let grandQty = 0;
      let grandAmt = 0;

      products.forEach(p => {
        let qtyTotal = 0;
        orders.forEach(o => {
          if (o.detailsStr && o.detailsStr.includes(p.name)) {
            const matches = o.detailsStr.split('、');
            matches.forEach(m => {
              if (m.includes(p.name)) {
                const parts = m.split('×');
                if (parts[1]) qtyTotal += parseInt(parts[1].trim()) || 0;
              }
            });
          }
        });

        const subtotal = qtyTotal * p.price;
        grandQty += qtyTotal;
        grandAmt += subtotal;

        if (qtyTotal > 0) {
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-2.5 font-medium text-slate-800">
                ${p.name}
                <span class="text-[11px] text-slate-400 block">${p.category}</span>
              </td>
              <td class="px-4 py-2.5 text-right text-slate-500">NT$ ${p.price}</td>
              <td class="px-4 py-2.5 text-center font-bold text-amber-800 bg-amber-50/30">${qtyTotal} 盒</td>
              <td class="px-4 py-2.5 text-right font-medium">NT$ ${subtotal.toLocaleString()}</td>
            </tr>
          `;
        }
      });

      if (grandQty === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-slate-400">目前尚無預購數據</td></tr>`;
      }

      document.getElementById('grandTotalQty').innerText = `${grandQty} 盒`;
      document.getElementById('grandTotalAmount').innerText = grandAmt.toLocaleString();
    }

    function renderOrdersList() {
      const container = document.getElementById('ordersList');
      document.getElementById('orderCount').innerText = orders.length;
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400 border border-dashed border-slate-200 rounded-xl">
            目前還沒有人下單，歡迎搶先填單！
          </div>
        `;
        return;
      }

      orders.forEach(o => {
        container.innerHTML += `
          <div class="border ${o.paid ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200 bg-white'} rounded-xl p-4 shadow-sm">
            <div class="flex items-center justify-between gap-2 mb-2 border-b border-slate-100 pb-2">
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-800 text-base">${o.userName}</span>
                <span class="text-[11px] text-slate-400">${o.time}</span>
              </div>
              
              <div class="flex items-center gap-2">
                <button 
                  type="button" 
                  onclick="togglePaid('${o.orderId}')" 
                  class="text-xs px-2.5 py-1 rounded-full font-bold flex items-center transition ${
                    o.paid ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-rose-100 text-rose-600 hover:bg-rose-200'
                  }"
                >
                  <i class="fa-solid ${o.paid ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                  ${o.paid ? '已付款' : '未付款'}
                </button>

                <button 
                  type="button" 
                  onclick="deleteOrder('${o.orderId}', '${o.userName}')" 
                  class="text-slate-400 hover:text-rose-600 p-1.5 transition rounded-lg hover:bg-rose-50"
                >
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </div>
            </div>

            <div class="text-sm text-slate-600 mb-2">
              ${o.detailsStr}
            </div>

            <div class="text-right text-xs text-slate-500">
              合計金額：<span class="text-base font-bold text-amber-800">NT$ ${o.totalAmount.toLocaleString()}</span>
            </div>
          </div>
        `;
      });
    }

    function exportCSV() {
      if (orders.length === 0) {
        alert('目前沒有資料可供匯出');
        return;
      }

      let csv = '\uFEFF單號,姓名,訂購明細,總金額,付款狀態,時間\n';
      orders.forEach(o => {
        csv += `"${o.orderId}","${o.userName}","${o.detailsStr}","${o.totalAmount}","${o.paid ? '已付款' : '未付款'}","${o.time}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `團購明細統計_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function copySummaryText() {
      let txt = `📋【甜點伴手禮團購 預購總數統計】\n截止日期：11/19 下午 3:00\n------------------\n`;
      let grandQty = 0;
      let grandAmt = 0;

      products.forEach(p => {
        let qtyTotal = 0;
        orders.forEach(o => {
          if (o.detailsStr && o.detailsStr.includes(p.name)) {
            const matches = o.detailsStr.split('、');
            matches.forEach(m => {
              if (m.includes(p.name)) {
                const parts = m.split('×');
                if (parts[1]) qtyTotal += parseInt(parts[1].trim()) || 0;
              }
            });
          }
        });
        if (qtyTotal > 0) {
          txt += `${p.name} × ${qtyTotal} 盒 (小計 $${qtyTotal * p.price})\n`;
          grandQty += qtyTotal;
          grandAmt += qtyTotal * p.price;
        }
      });

      txt += `------------------\n總預購量：${grandQty} 盒\n總金額：NT$ ${grandAmt.toLocaleString()} 元\n`;
      txt += `參團總人數：${orders.length} 人`;

      navigator.clipboard.writeText(txt).then(() => {
        alert('統計文字已複製到剪貼簿！可直接貼至 LINE 群組。');
      }).catch(() => {
        alert('複製失敗，請手動複製。');
      });
    }

    function startCountdown() {
      const targetDate = new Date(`2026/11/19 15:00:00`);
      function update() {
        const diff = targetDate - new Date();
        if (diff <= 0) {
          document.getElementById('countdownText').innerText = '團購已截止';
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / 1000 / 60) % 60);

        let str = '';
        if (days > 0) str += `${days}天 `;
        str += `${hours}小時 ${mins}分`;
        document.getElementById('countdownText').innerText = `剩餘 ${str}`;
      }
      update();
      setInterval(update, 30000);
    }

    window.onload = function() {
      initProducts();
      loadOrders();
      startCountdown();
    };
  </script>
</body>
</html>
